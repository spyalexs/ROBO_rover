ekf_filter_node:
  ros__parameters:
    # Update frequency (Hz). 30Hz is a good balance for Raspberry Pi
    frequency: 30.0
    
    # Set to true for 2D robots (ignores Z, Roll, and Pitch)
    two_d_mode: true
    
    # Whether to broadcast the transform from odom_frame to base_link_frame
    publish_tf: true

    # Frame definitions
    map_frame: map              # Provided by SLAM (Slam Toolbox)
    odom_frame: odom            # Provided by EKF
    base_link_frame: base_link  # Physical center of the robot
    world_frame: odom           # Local loop closure frame

    # --- 1. Odometry Input (From your rover_node's cmd_vel logic) ---
    # We use this to get a rough estimate of X and Y movement
    odom0: /odom
    # Configuration: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0_config: [true,  true,  false, 
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_relative: false

    # --- 2. IMU Input (From Pixhawk via MAVLink) ---
    # This is critical for accurate heading/turning
    imu0: /imu/data
    # Configuration: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    imu0_config: [false, false, false,
                  false, false, true,  # Use Absolute Yaw (Heading)
                  false, false, false,
                  false, false, true,  # Use Angular Velocity Z
                  true,  false, false] # Use Linear Acceleration X
    imu0_nodelay: true
    imu0_relative: false

    # --- Process Noise Covariance (Optional Tuning) ---
    # If the map still drifts, we can increase the uncertainty of the Odom X/Y
    # to force EKF to rely more on the IMU and SLAM's scan matching.